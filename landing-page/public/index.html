<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>TGH Services — Em manutenção</title>
<link rel="icon" type="image/png" href="/logo-tghservices.png">
<style>
  :root {
    --fundo: #f4f7fb;
    --cartao: #ffffff;
    --texto: #0b2545;
    --texto-suave: #4a5d78;
    --borda: #dbe4ef;
    --destaque: #2f80d1;
    --destaque-fundo: #e6f1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #07182e;
      --cartao: #0d223d;
      --texto: #eaf2fb;
      --texto-suave: #a9bbd1;
      --borda: #1b3556;
      --destaque: #6fb1f0;
      --destaque-fundo: #12345a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 40px 32px 36px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(11, 37, 69, 0.08);
  }
  .logo {
    display: inline-block;
    background: #ffffff;
    border-radius: 14px;
    padding: 8px 12px;
  }
  .logo img { display: block; width: 260px; max-width: 100%; height: auto; }
  .divisor { width: 48px; height: 3px; border-radius: 3px; background: var(--destaque); margin: 28px auto 24px; }
  .selo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--destaque);
    background: var(--destaque-fundo);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .selo::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    animation: pulso 1.8s ease-in-out infinite;
  }
  @keyframes pulso { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .selo::before { animation: none; } }
  h1 { font-size: 26px; line-height: 1.25; margin: 18px 0 10px; letter-spacing: -0.01em; }
  p { font-size: 16px; line-height: 1.6; color: var(--texto-suave); margin: 0 auto; max-width: 380px; }
  .atalhos {
    width: 100%;
    max-width: 520px;
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .atalho {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
    color: var(--texto);
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 16px 18px;
    text-decoration: none;
    touch-action: manipulation;
    transition: border-color .15s, transform .15s;
  }
  .atalho strong { font-size: 15px; color: var(--destaque); }
  .atalho .descricao { font-size: 14px; line-height: 1.45; color: var(--texto-suave); }
  .atalho:hover { border-color: var(--destaque); transform: translateY(-1px); }
  .atalho:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .atalho { transition: none; } .atalho:hover { transform: none; } }
  footer { margin-top: 20px; font-size: 13px; color: var(--texto-suave); }
  @media (max-width: 480px) {
    main { padding: 32px 20px 28px; border-radius: 16px; }
    .logo img { width: 210px; }
    h1 { font-size: 22px; }
    p { font-size: 15px; }
    .atalhos { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main>
    <div class="logo"><img src="/logo-tghservices.png" width="500" height="250" alt="TGH Services"></div>
    <div class="divisor" aria-hidden="true"></div>
    <span class="selo">Em manutenção</span>
    <h1>Estamos em manutenção</h1>
    <p>Estamos preparando novidades para você. O site volta em breve.</p>
  </main>
  <nav class="atalhos" aria-label="Atalhos">
    <a class="atalho" href="https://controlepresenca.tghservices.com.br/">
      <strong>Controle de Presença <span aria-hidden="true">→</span></strong>
      <span class="descricao">App de presença das aulas (versão inicial).</span>
    </a>
    <a class="atalho" href="/curriculo">
      <strong>Currículo <span aria-hidden="true">→</span></strong>
      <span class="descricao">Conheça o currículo de Pierre Alves.</span>
    </a>
  </nav>
  <footer>© 2026 TGH Services</footer>
</body>
</html>
